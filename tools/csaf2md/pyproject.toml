[project]
name = "csaf2md"
version = "0.1.0"
description = "Convert CSAF JSON files into human-readable Markdown advisories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mdutils==1.8.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
